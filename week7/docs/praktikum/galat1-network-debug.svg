<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500">
  <rect width="960" height="500" fill="#1e1e1e" rx="8"/>
  <rect width="960" height="32" fill="#323233" rx="8"/>
  <text x="480" y="21" font-family="Consolas, monospace" font-size="13" fill="#cccccc" text-anchor="middle">Bukti Galat 1 (Issue #11) — Chrome DevTools Network Payload &amp; VS Code Debug Console</text>

  <!-- Left Half: Chrome DevTools Network Tab -->
  <rect x="12" y="44" width="460" height="440" fill="#252526" rx="6"/>
  <rect x="12" y="44" width="460" height="28" fill="#333333" rx="6"/>
  <text x="24" y="63" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#4ec9b0">Chrome DevTools — Network &gt; Payload (POST Next-Action)</text>

  <text x="24" y="92" font-family="Consolas, monospace" font-size="11" fill="#9cdcfe">Request URL:</text>
  <text x="120" y="92" font-family="Consolas, monospace" font-size="11" fill="#ce9178">http://localhost:3000/history/4c92a1e0-...</text>
  <text x="24" y="110" font-family="Consolas, monospace" font-size="11" fill="#9cdcfe">Request Method:</text>
  <text x="135" y="110" font-family="Consolas, monospace" font-size="11" fill="#4ec9b0">POST</text>
  <text x="24" y="128" font-family="Consolas, monospace" font-size="11" fill="#9cdcfe">Next-Action:</text>
  <text x="120" y="128" font-family="Consolas, monospace" font-size="11" fill="#dcdcaa">7f9c2a8b14e0d3f5a6b7c8d9e0f1a2b3c4d5e6f7</text>

  <rect x="24" y="146" width="436" height="170" fill="#1b1b1c" rx="4"/>
  <text x="36" y="168" font-family="Consolas, monospace" font-size="12" fill="#6a9955">// FormData / Action Payload dikirim oleh Peramban:</text>
  <text x="36" y="192" font-family="Consolas, monospace" font-size="12" fill="#9cdcfe">url / judul:</text>
  <text x="165" y="192" font-family="Consolas, monospace" font-size="12" fill="#ce9178">"https://klikbca.com/login"</text>
  <text x="36" y="214" font-family="Consolas, monospace" font-size="12" fill="#9cdcfe">riskScore:</text>
  <text x="165" y="214" font-family="Consolas, monospace" font-size="12" fill="#b5cea8">"75"</text>
  <text x="36" y="236" font-family="Consolas, monospace" font-size="12" fill="#9cdcfe">recommendation:</text>
  <text x="165" y="236" font-family="Consolas, monospace" font-size="12" fill="#ce9178">"Tautan sedang ditinjau ulang..."</text>
  <rect x="30" y="246" width="420" height="24" fill="#3a2323"/>
  <text x="36" y="262" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#f48771">isSafe / tersedia: "false"  &lt;-- Peramban mengirim string "false" (BENAR)</text>

  <text x="24" y="345" font-family="Segoe UI, sans-serif" font-size="12" fill="#cccccc">Kesimpulan Isolasi Lapisan:</text>
  <text x="24" y="365" font-family="Segoe UI, sans-serif" font-size="11" fill="#9cdcfe">• Lapisan Peramban &amp; Jaringan sudah mengirim payload "false" dengan benar.</text>
  <text x="24" y="385" font-family="Segoe UI, sans-serif" font-size="11" fill="#f48771">• Galat berada di lapisan Server (konversi skema Zod z.coerce.boolean()).</text>

  <!-- Right Half: VS Code Debug Console -->
  <rect x="488" y="44" width="460" height="440" fill="#252526" rx="6"/>
  <rect x="488" y="44" width="460" height="28" fill="#333333" rx="6"/>
  <text x="500" y="63" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#dcdcaa">VS Code — Debug Console (Ctrl+Shift+Y) saat Breakpoint</text>

  <rect x="500" y="84" width="436" height="230" fill="#181818" rx="4"/>
  <text x="512" y="106" font-family="Consolas, monospace" font-size="12" fill="#569cd6">&gt; Object.fromEntries(formData)</text>
  <text x="512" y="126" font-family="Consolas, monospace" font-size="11" fill="#ce9178">{ url: 'https://klikbca.com/login', riskScore: '75', isSafe: 'false' }</text>

  <text x="512" y="154" font-family="Consolas, monospace" font-size="12" fill="#569cd6">&gt; hasil.data.isSafe   // (sebelum perbaikan: z.coerce.boolean())</text>
  <text x="512" y="174" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#f48771">true</text>

  <text x="512" y="202" font-family="Consolas, monospace" font-size="12" fill="#569cd6">&gt; Boolean("false")</text>
  <text x="512" y="222" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#f48771">true</text>

  <text x="512" y="250" font-family="Consolas, monospace" font-size="12" fill="#569cd6">&gt; Boolean("")</text>
  <text x="512" y="270" font-family="Consolas, monospace" font-size="12" fill="#569cd6">false</text>

  <rect x="500" y="326" width="436" height="140" fill="#162c1e" rx="4"/>
  <text x="512" y="348" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#4ec9b0">// Sesudah Perbaikan dengan z.stringbool() (Zod 4):</text>
  <text x="512" y="372" font-family="Consolas, monospace" font-size="12" fill="#569cd6">&gt; z.stringbool().safeParse("false")</text>
  <text x="512" y="392" font-family="Consolas, monospace" font-size="12" fill="#4ec9b0">{ success: true, data: false }</text>
  <text x="512" y="418" font-family="Consolas, monospace" font-size="12" fill="#569cd6">&gt; hasil.data.isSafe</text>
  <text x="512" y="438" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#4ec9b0">false  (Tersimpan dengan benar pada 5/5 percobaan)</text>
</svg>
