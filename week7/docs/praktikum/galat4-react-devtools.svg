<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <rect width="960" height="480" fill="#1e1e1e" rx="8"/>
  <rect width="960" height="32" fill="#323233" rx="8"/>
  <text x="480" y="21" font-family="Consolas, monospace" font-size="13" fill="#cccccc" text-anchor="middle">Bukti Galat 4 (Issue #14) — React Developer Tools (Components) &amp; DevTools Sources</text>

  <!-- Left Box: Before Fix -->
  <rect x="16" y="48" width="456" height="412" fill="#252526" rx="6"/>
  <rect x="16" y="48" width="456" height="30" fill="#4b1e1e" rx="6"/>
  <text x="28" y="68" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#f48771">SEBELUM PERBAIKAN — State Ganda &amp; useEffect(..., [])</text>

  <text x="28" y="100" font-family="Consolas, monospace" font-size="12" fill="#4ec9b0">▼ &lt;HistoryDetailPage&gt; / &lt;FormUlasan&gt;</text>
  <text x="44" y="124" font-family="Consolas, monospace" font-size="12" fill="#9cdcfe">props</text>
  <text x="60" y="144" font-family="Consolas, monospace" font-size="11" fill="#cccccc">analysisId: "4c92a1e0-7b12-4d9a-8c1e-..."</text>
  <text x="44" y="172" font-family="Consolas, monospace" font-size="12" fill="#9cdcfe">hooks</text>
  <text x="60" y="194" font-family="Consolas, monospace" font-size="12" fill="#dcdcaa">1. State (newDetail / isi):</text>
  <text x="76" y="214" font-family="Consolas, monospace" font-size="12" fill="#ce9178">"Tautan menggunakan domain .xyz mencurigakan"</text>
  <rect x="54" y="226" width="400" height="44" fill="#3a2323" rx="4"/>
  <text x="60" y="244" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#f48771">2. State (sisa): 500  (atau 280 pada FormUlasan)</text>
  <text x="60" y="262" font-family="Consolas, monospace" font-size="11" fill="#f48771">   ^ TIDAK PERNAH BERUBAH saat pengguna mengetik!</text>
  <text x="60" y="290" font-family="Consolas, monospace" font-size="12" fill="#dcdcaa">3. Effect:</text>
  <text x="76" y="310" font-family="Consolas, monospace" font-size="11" fill="#858585">() =&gt; { setSisa(500 - newDetail.length); }  deps: []</text>

  <text x="28" y="350" font-family="Segoe UI, sans-serif" font-size="11" fill="#cccccc">Temuan Panel Sources (Breakpoint di dalam useEffect):</text>
  <text x="28" y="370" font-family="Segoe UI, sans-serif" font-size="11" fill="#9cdcfe">• Breakpoint hanya tersentuh saat komponen mount pertama kali.</text>
  <text x="28" y="390" font-family="Segoe UI, sans-serif" font-size="11" fill="#9cdcfe">• Larik dependensi kosong [] mencegah efek berjalan saat teks berubah.</text>

  <!-- Right Box: After Fix -->
  <rect x="488" y="48" width="456" height="412" fill="#252526" rx="6"/>
  <rect x="488" y="48" width="456" height="30" fill="#1b3b26" rx="6"/>
  <text x="500" y="68" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#4ec9b0">SESUDAH PERBAIKAN — Nilai Turunan Dihitung Saat Render</text>

  <text x="500" y="100" font-family="Consolas, monospace" font-size="12" fill="#4ec9b0">▼ &lt;HistoryDetailPage&gt; / &lt;FormUlasan&gt;</text>
  <text x="516" y="124" font-family="Consolas, monospace" font-size="12" fill="#9cdcfe">hooks</text>
  <text x="532" y="148" font-family="Consolas, monospace" font-size="12" fill="#dcdcaa">1. State (newDetail / isi):</text>
  <text x="548" y="168" font-family="Consolas, monospace" font-size="12" fill="#ce9178">"halo"</text>

  <rect x="516" y="190" width="408" height="90" fill="#162c1e" rx="4"/>
  <text x="528" y="214" font-family="Consolas, monospace" font-size="12" fill="#6a9955">// Nilai turunan dihitung langsung saat render:</text>
  <text x="528" y="236" font-family="Consolas, monospace" font-size="12" fill="#9cdcfe">const sisaKarakterDetail = 500 - newDetail.length; // 496</text>
  <text x="528" y="258" font-family="Consolas, monospace" font-size="12" fill="#9cdcfe">const sisa = 280 - isi.length;                    // 276</text>

  <text x="500" y="315" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#4ec9b0">Hasil Verifikasi:</text>
  <text x="500" y="338" font-family="Segoe UI, sans-serif" font-size="11" fill="#cccccc">• Mengetik "halo" (4 karakter) langsung menampilkan:</text>
  <text x="514" y="358" font-family="Consolas, monospace" font-size="12" fill="#4ec9b0">"496 karakter tersisa" (batas 500) / "276 karakter tersisa" (batas 280)</text>
  <text x="500" y="382" font-family="Segoe UI, sans-serif" font-size="11" fill="#cccccc">• Hanya 1 state input, 1 render per ketikan, tanpa useEffect tambahan.</text>
  <text x="500" y="404" font-family="Segoe UI, sans-serif" font-size="11" fill="#cccccc">• npm run lint &amp; npx tsc --noEmit bersih (0 error, 0 warning).</text>
</svg>
